%YAML 1.1
---
/**:
  ros__parameters:
    # Common parameters
    imu_topic: "/camera/imu/data_raw"
    image_topic: "/camera/color/image_raw"
    output_path: "/home/tony-ws1/output/"

    # Camera calibration
    model_type: "PINHOLE"
    camera_name: "camera"
    image_width: 640
    image_height: 480
    distortion_parameters:
      k1: 9.2615504465028850e-02
      k2: -1.8082438825995681e-01
      p1: -6.5484100374765971e-04
      p2: -3.5829351558557421e-04
    projection_parameters:
      fx: 6.0970550296798035e+02
      fy: 6.0909579671294716e+02
      cx: 3.1916667152289227e+02
      cy: 2.3558360480225772e+02

    # Extrinsic parameter between IMU and camera.
    estimate_extrinsic: 0

    # Rotation from camera frame to IMU frame, imu^R_cam.
    extrinsicRotation: [0.99964621, 0.01105994, 0.02418954,
                         -0.01088975, 0.9999151, -0.00715601,
                         -0.02426663, 0.00689006, 0.99968178]

    # Translation from camera frame to IMU frame, imu^T_cam.
    extrinsicTranslation: [0.07494282, -0.01077138, -0.00641822]

    # Feature tracker parameters
    max_cnt: 150
    min_dist: 25
    freq: 10
    F_threshold: 1.0
    show_track: 1
    equalize: 0
    fisheye: 0

    # Optimization parameters
    max_solver_time: 0.04
    max_num_iterations: 8
    keyframe_parallax: 10.0

    # IMU parameters
    acc_n: 0.1
    gyr_n: 0.01
    acc_w: 0.0002
    gyr_w: 2.0e-5
    g_norm: 9.805

    # Loop closure parameters
    loop_closure: 1
    fast_relocalization: 1
    load_previous_pose_graph: 0
    pose_graph_save_path: "/home/tony-ws1/output/pose_graph/"

    # Unsynchronized sensor parameters
    estimate_td: 1
    td: 0.000

    # Rolling shutter parameters
    rolling_shutter: 1
    rolling_shutter_tr: 0.033

    # Visualization parameters
    save_image: 1
    visualize_imu_forward: 0
    visualize_camera_size: 0.4
