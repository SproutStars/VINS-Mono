%YAML 1.1
---
/**:
  ros__parameters:
    # Common parameters
    imu_topic: "/camera/imu/data_raw"
    image_topic: "/camera/fisheye/image_raw"
    output_path: "/home/tony-ws1/output/"

    # Camera calibration
    model_type: "KANNALA_BRANDT"
    camera_name: "camera"
    image_width: 640
    image_height: 480
    projection_parameters:
      k2: 1.7280355035195181e-02
      k3: -2.5505200860040985e-02
      k4: 2.2621441637715487e-02
      k5: -7.3355871719731113e-03
      mu: 2.7723712054408202e+02
      mv: 2.7699784668734617e+02
      u0: 3.3625356873985868e+02
      v0: 2.3603924727453901e+02

    # Extrinsic parameter between IMU and camera.
    estimate_extrinsic: 1

    # Rotation from camera frame to IMU frame, imu^R_cam.
    extrinsicRotation: [0.99992917, 0.00878151, 0.00803387,
                         -0.00870674, 0.9999189, -0.0092943,
                         -0.00811483, 0.00922369, 0.99992453]

    # Translation from camera frame to IMU frame, imu^T_cam.
    extrinsicTranslation: [0.00188568, 0.00123801, 0.01044055]

    # Feature tracker parameters
    max_cnt: 120
    min_dist: 30
    freq: 10
    F_threshold: 1.0
    show_track: 1
    equalize: 0
    fisheye: 0

    # Optimization parameters
    max_solver_time: 0.04
    max_num_iterations: 8
    keyframe_parallax: 10.0

    # IMU parameters
    acc_n: 0.08
    gyr_n: 0.004
    acc_w: 0.00004
    gyr_w: 2.0e-6
    g_norm: 9.805

    # Loop closure parameters
    loop_closure: 1
    fast_relocalization: 1
    load_previous_pose_graph: 0
    pose_graph_save_path: "/home/tony-ws1/output/pose_graph/"

    # Unsynchronized sensor parameters
    estimate_td: 1
    td: 0.010

    # Rolling shutter parameters
    rolling_shutter: 0
    rolling_shutter_tr: 0

    # Visualization parameters
    save_image: 1
    visualize_imu_forward: 0
    visualize_camera_size: 0.4
