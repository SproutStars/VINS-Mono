%YAML 1.1
---
/**:
  ros__parameters:
    # Common parameters
    imu_topic: "/imu0"
    image_topic: "/cam0/image_raw"
    output_path: "/home/tony-ws1/output/"

    # Camera calibration
    model_type: "KANNALA_BRANDT"
    camera_name: "camera"
    image_width: 512
    image_height: 512
    projection_parameters:
      k2: 0.0034823894022493434
      k3: 0.0007150348452162257
      k4: -0.0020532361418706202
      k5: 0.00020293673591811182
      mu: 190.97847715128717
      mv: 190.9733070521226
      u0: 254.93170605935475
      v0: 256.8974428996504

    # Extrinsic parameter between IMU and camera.
    estimate_extrinsic: 0

    # Rotation from camera frame to IMU frame, imu^R_cam.
    extrinsicRotation: [-9.9951465899298464e-01, 7.5842033363785165e-03, -3.0214670573904204e-02,
                         2.9940114644659861e-02, -3.4023430206013172e-02, -9.9897246995704592e-01,
                         -8.6044170750674241e-03, -9.9939225835343004e-01, 3.3779845322755464e-02]

    # Translation from camera frame to IMU frame, imu^T_cam.
    extrinsicTranslation: [4.4511917113940799e-02, -7.3197096234105752e-02, -4.7972907300764499e-02]

    # Feature tracker parameters
    max_cnt: 150
    min_dist: 25
    freq: 10
    F_threshold: 1.0
    show_track: 1
    equalize: 1
    fisheye: 1

    # Optimization parameters
    max_solver_time: 0.04
    max_num_iterations: 8
    keyframe_parallax: 10.0

    # IMU parameters
    acc_n: 0.04
    gyr_n: 0.004
    acc_w: 0.0004
    gyr_w: 2.0e-5
    g_norm: 9.80766

    # Loop closure parameters
    loop_closure: 0
    load_previous_pose_graph: 0
    fast_relocalization: 0
    pose_graph_save_path: "/home/tony-ws1/output/pose_graph/"

    # Unsynchronized sensor parameters
    estimate_td: 0
    td: 0.0

    # Rolling shutter parameters
    rolling_shutter: 0
    rolling_shutter_tr: 0

    # Visualization parameters
    save_image: 1
    visualize_imu_forward: 0
    visualize_camera_size: 0.4
