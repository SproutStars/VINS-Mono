%YAML 1.1
---
/**:
   ros__parameters:
      # Common parameters
      imu_topic: "/imu0"
      image_topic: "/cam0/image_raw"
      output_path: ./output/

      # Camera calibration
      model_type: "PINHOLE"
      camera_name: "narrow_stereo"
      # Optional: read the intrinsics directly from a ROS camera_info yaml file.
      # Relative paths are resolved against this file's directory, then vins_folder.
      # When the file is readable it overrides the intrinsic parameters below.
      camera_info_file: "camera_info.yaml"
      image_width: 1440
      image_height: 1080
      distortion_parameters:
         k1: -6.0615e-02
         k2: -1.0496e-02
         p1: -1.570e-03
         p2: -6.12e-04
      projection_parameters:
         fx: 1.80863885e+03
         fy: 1.80688425e+03
         cx: 7.3676199e+02
         cy: 5.6972947e+02

      # Extrinsic parameter between IMU and camera.
      # 0: accurate extrinsics; use imu^R_cam and imu^T_cam without changing them.
      # 1: initial extrinsics; optimize around the initial guess.
      # 2: unknown extrinsics; calibrate them during startup.
      estimate_extrinsic: 0

      # Rotation from camera frame to IMU frame, imu^R_cam.
      # ROS 2 parameters support a flat array for matrix values.
      extrinsicRotation: [0.0148655429818, -0.999880929698, 0.00414029679422,
                           0.999557249008, 0.0149672133247, 0.025715529948,
                           -0.0257744366974, 0.00375618835797, 0.999660727178]
      # Translation from camera frame to IMU frame, imu^T_cam.
      extrinsicTranslation: [-0.0216401454975, -0.064676986768, 0.00981073058949]

      # Feature tracker parameters
      max_cnt: 150
      min_dist: 30
      freq: 10
      F_threshold: 1.0
      show_track: 1
      equalize: 1
      fisheye: 0

      # Optimization parameters
      max_solver_time: 0.04
      max_num_iterations: 8
      keyframe_parallax: 10.0

      # IMU parameters
      acc_n: 0.08
      gyr_n: 0.004
      acc_w: 0.00004
      gyr_w: 2.0e-6
      g_norm: 9.81007

      # Loop closure parameters
      loop_closure: 1
      load_previous_pose_graph: 0
      fast_relocalization: 0
      pose_graph_save_path: ./output/pose_graph/

      # Unsynchronized sensor parameters
      estimate_td: 0
      td: 0.0

      # Rolling shutter parameters
      rolling_shutter: 0
      rolling_shutter_tr: 0.0

      # Visualization parameters
      save_image: 1
      visualize_imu_forward: 0
      visualize_camera_size: 0.4
