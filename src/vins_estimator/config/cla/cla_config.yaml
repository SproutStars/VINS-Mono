%YAML 1.1
---
/**:
  ros__parameters:
    # Common parameters
    imu_topic: "/imu0"
    image_topic: "/cam0/image_raw"
    output_path: "/home/tony-ws1/output/"

    # Camera calibration
    model_type: "KANNALA_BRANDT"
    camera_name: "camera"
    image_width: 752
    image_height: 480
    projection_parameters:
      k2: -0.005740195474458931
      k3: 0.02878252863739417
      k4: -0.04010621197185408
      k5: 0.02008469575876223
      mu: 472.2863830700696
      mv: 470.83759684346785
      u0: 368.8316828103749
      v0: 232.23688706965652

    # Extrinsic parameter between IMU and camera.
    estimate_extrinsic: 0

    # Rotation from camera frame to IMU frame, imu^R_cam.
    extrinsicRotation: [0.99992185, -0.01241689, -0.00145542,
                         0.01242827, 0.99989004, 0.00809021,
                         0.0013548, -0.00810766, 0.99996621]

    # Translation from camera frame to IMU frame, imu^T_cam.
    extrinsicTranslation: [0.03661314, -0.01027102, -0.00654466]

    # Feature tracker parameters
    max_cnt: 150
    min_dist: 30
    freq: 10
    F_threshold: 1.0
    show_track: 1
    equalize: 1
    fisheye: 0

    # Optimization parameters
    max_solver_time: 0.04
    max_num_iterations: 8
    keyframe_parallax: 10.0

    # IMU parameters
    acc_n: 0.04
    gyr_n: 0.001
    acc_w: 0.001
    gyr_w: 0.0001
    g_norm: 9.81

    # Loop closure parameters
    loop_closure: 1
    load_previous_pose_graph: 0
    fast_relocalization: 0
    pose_graph_save_path: "/home/tony-ws1/output/pose_graph/"

    # Unsynchronized sensor parameters
    estimate_td: 0
    td: 0.0

    # Rolling shutter parameters
    rolling_shutter: 0
    rolling_shutter_tr: 0

    # Visualization parameters
    save_image: 1
    visualize_imu_forward: 0
    visualize_camera_size: 0.4
