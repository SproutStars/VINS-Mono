%YAML 1.1
---
/**:
  ros__parameters:
    # Common parameters
    imu_topic: "/djiros/imu"
    image_topic: "/djiros/image"
    output_path: "/home/urop/output/"

    # Camera calibration
    model_type: "MEI"
    camera_name: "camera"
    image_width: 752
    image_height: 480
    mirror_parameters:
      xi: 2.2134257311108083e+00
    distortion_parameters:
      k1: 1.4213768437132895e-01
      k2: 9.1226950620748259e-01
      p1: 1.2056297779277966e-03
      p2: 2.0300076091651340e-03
    projection_parameters:
      gamma1: 1.1659242643040975e+03
      gamma2: 1.1656143723709608e+03
      u0: 3.9238492754088008e+02
      v0: 2.4392485271819217e+02

    # Extrinsic parameter between IMU and camera.
    estimate_extrinsic: 1

    # Rotation from camera frame to IMU frame, imu^R_cam.
    extrinsicRotation: [3.5547377966504534e-02, -9.9819308302994181e-01, -4.8445360055281682e-02,
                         9.9855985185796758e-01, 3.3527772724371241e-02, 4.1882104932016398e-02,
                         -4.0182162424389177e-02, -4.9864390574059170e-02, 9.9794736152543517e-01]

    # Translation from camera frame to IMU frame, imu^T_cam.
    extrinsicTranslation: [6.5272135116678912e-02, -6.8544177447541876e-02, 3.7304589197375740e-02]

    # Feature tracker parameters
    max_cnt: 120
    min_dist: 30
    freq: 10
    F_threshold: 1.0
    show_track: 1
    equalize: 1
    fisheye: 0

    # Optimization parameters
    max_solver_time: 0.04
    max_num_iterations: 8
    keyframe_parallax: 10.0

    # IMU parameters
    acc_n: 0.2
    gyr_n: 0.05
    acc_w: 0.002
    gyr_w: 4.0e-5
    g_norm: 9.805

    # Loop closure parameters
    loop_closure: 1
    load_previous_pose_graph: 0
    fast_relocalization: 1
    pose_graph_save_path: "/home/tony-ws1/output/pose_graph/"

    # Unsynchronized sensor parameters
    estimate_td: 1
    td: 0.0

    # Rolling shutter parameters
    rolling_shutter: 0
    rolling_shutter_tr: 0

    # Visualization parameters
    save_image: 1
    visualize_imu_forward: 1
    visualize_camera_size: 0.4
